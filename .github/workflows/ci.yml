name: Python and Docker validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests migrations
      - name: Run unit and integration tests
        run: python -m pytest tests -q --cov=ailiss --cov-report=xml
      - name: Validate documentation
        run: python scripts/validate_docs.py
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  docker-smoke:
    name: Docker API-only smoke
    runs-on: ubuntu-latest
    needs: python
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start API only
        run: docker compose up --build -d api
      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api
          exit 1
      - name: Verify migration and API contract
        run: |
          docker compose exec -T api python -m alembic current | grep "003_phase3 (head)"
          curl --fail --silent http://127.0.0.1:18000/health
      - name: Show container resources
        run: docker stats --no-stream
      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans --volumes
