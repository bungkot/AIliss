name: AIliss Integrations

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests migrations
      - name: Run unit and integration tests
        run: python -m pytest tests -q --cov=ailiss --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  documentation:
    name: Documentation validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate repository documentation
        run: python scripts/validate_docs.py
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install Mermaid CLI
        run: npm install --global @mermaid-js/mermaid-cli@11
      - name: Validate Mermaid diagrams
        run: |
          validation_dir="${RUNNER_TEMP}/mermaid-validation"
          mkdir -p "$validation_dir"
          find docs -name '*.md' -print0 | while IFS= read -r -d '' file; do
            if grep -Eq '^```mermaid[[:space:]]*$' "$file"; then
              output="${validation_dir}/diagram.svg"
              echo "Validating Mermaid diagram(s) in $file"
              mmdc -p scripts/mermaid-puppeteer.json -i "$file" -o "$output" || exit 1
            fi
          done
          rm -f "${validation_dir}"/*.svg "${validation_dir}"/*.png "${validation_dir}"/*.pdf
          rmdir "$validation_dir"

  docker-smoke:
    name: Docker PostgreSQL smoke
    runs-on: ubuntu-24.04
    needs: python
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build and start PostgreSQL and API
        run: |
          docker compose --profile postgres up --build -d postgres api-postgres
      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api-postgres postgres
          exit 1
      - name: Verify migration and API contract
        run: |
          docker compose exec -T api-postgres python -m alembic current | grep "005_phase5 (head)"
          curl --fail --silent http://127.0.0.1:18000/health
      - name: Show container resources
        run: docker stats --no-stream
      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans --volumes
