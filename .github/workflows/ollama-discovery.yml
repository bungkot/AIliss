name: Ollama discovery smoke

on:
  workflow_dispatch:
    inputs:
      discovery_prompt:
        description: "Discovery prompt for the policy-gated fixture campaign"
        required: false
        default: "Build candidate customer leads for Indonesian wedding vendors from approved public fixture sources."
        type: string
      target_count:
        description: "Maximum number of candidate leads to discover and rank"
        required: false
        default: "200"
        type: string
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ollama-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ollama-discovery:
    name: Ollama qwen3 discovery smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        env:
          OLLAMA_HOST: 127.0.0.1:11434
        run: |
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ollama.pid"

      - name: Wait for Ollama
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/ollama.log"
          exit 1

      - name: Pull and verify model
        run: |
          ollama pull qwen3:0.6b
          ollama list | grep "^qwen3:0.6b[[:space:]]"
          curl --fail --silent \
            http://127.0.0.1:11434/api/generate \
            -H "Content-Type: application/json" \
            -d '{"model":"qwen3:0.6b","prompt":"Reply with healthy.","stream":false,"think":false,"options":{"temperature":0,"num_predict":16}}' \
            > "$RUNNER_TEMP/ollama-warmup.json"

      - name: Run deterministic full suite
        run: python -m pytest tests -q

      - name: Run API discovery and Ollama integration smoke
        env:
          AILISS_LIVE_OLLAMA: "1"
          AILISS_OLLAMA_TIMEOUT_SECONDS: "120"
          AILISS_AGENT_MAX_WALL_SECONDS: "120"
          AILISS_DISCOVERY_OUTPUT: ${{ runner.temp }}/wedding-leads.json
          AILISS_DISCOVERY_PROMPT: ${{ inputs.discovery_prompt || 'Build 200 candidate customer leads for Indonesian wedding vendors. Categories include wedding organizers, photographers, videographers, content creators, bridal studios, and digital invitation vendors. Each candidate must have at least one business contact.' }}
          AILISS_DISCOVERY_TARGET_COUNT: ${{ inputs.target_count || '200' }}
        run: python -m pytest tests/test_ollama_discovery.py -q

      - name: Upload candidate lead sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wedding-discovery-candidates
          path: ${{ runner.temp }}/wedding-leads.json
          if-no-files-found: warn

      - name: Publish discovery workflow summary
        if: always()
        env:
          AILISS_DISCOVERY_OUTPUT: ${{ runner.temp }}/wedding-leads.json
        run: |
          python <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["AILISS_DISCOVERY_OUTPUT"])
          if not path.exists():
              print("## Discovery workflow")
              print("")
              print("No discovery output was produced.")
              raise SystemExit(0)

          result = json.loads(path.read_text(encoding="utf-8"))
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          lines = [
              "## Discovery workflow",
              "",
              "- Terminal stage: `{}`".format(result.get("terminal_status", "blocked")),
              "- Candidates: {}".format(result["candidate_count"]),
              "- Ranked: {}".format(len(result.get("ranked_leads", []))),
              "- Human review required: {}".format(str(result["human_review_required"]).lower()),
              "- Personal data collection: `{}`".format(result["personal_data_collection"]),
              "",
              "| Rank | Company | Category | Location | Confidence |",
              "|---:|---|---|---|---:|",
          ]
          for lead in result.get("ranked_leads", [])[:10]:
              lines.append(
                  "| {rank} | {company_name} | {business_category} | {location} | {confidence_score:.2f} |".format(
                      **lead
                  )
              )
          Path(summary).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Run discovery inference smoke test
        run: |
          curl --fail --silent \
            http://127.0.0.1:11434/api/generate \
            -H "Content-Type: application/json" \
            -d '{
              "model": "qwen3:0.6b",
              "prompt": "Return only a JSON object with keys status and message. Set status to healthy and message to discovery smoke test.",
              "format": "json",
              "stream": false,
              "think": false,
              "options": {"temperature": 0, "num_predict": 256}
            }' \
            > "$RUNNER_TEMP/ollama-response.json"
          python -c '
          import json
          import pathlib
          import sys

          response_path = pathlib.Path(sys.argv[1])
          envelope = json.loads(response_path.read_text(encoding="utf-8"))
          text = envelope["response"].strip()
          start = text.find("{")
          end = text.rfind("}")
          if start < 0 or end < start:
              raise SystemExit(f"Model response is not JSON: {text}")

          result = json.loads(text[start:end + 1])
          if result.get("status") != "healthy":
              raise SystemExit(f"Unexpected discovery status: {result}")
          if not isinstance(result.get("message"), str) or not result["message"].strip():
              raise SystemExit(f"Discovery message is missing: {result}")
          print(json.dumps(result, ensure_ascii=False))
          ' "$RUNNER_TEMP/ollama-response.json"

      - name: Stop Ollama
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ollama.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/ollama.pid")" 2>/dev/null || true
          fi
